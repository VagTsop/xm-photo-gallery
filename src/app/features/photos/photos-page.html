<app-page-header
  title="Gallery"
  subtitle="An endless stream of photography from Picsum. Tap the heart on any shot to keep it."
  [count]="photos().length || null"
/>

<app-photo-grid
  [photos]="photos()"
  [favoriteIds]="favoriteIds()"
  [loading]="loading()"
  [error]="error()"
  [hasMore]="hasMore()"
  emptyMessage="No photos yet."
  (loadMore)="onLoadMore()"
  (retry)="onRetry()"
  (favoriteToggled)="onFavoriteToggled($event)"
/>
