<div class="page-header">
  <div class="page-header__text">
    <h1 class="page-header__title">
      {{ title() }}
      @if (count() !== null) {
        <span class="page-header__count" data-testid="page-header-count">
          {{ count() }} {{ countLabel() }}
        </span>
      }
    </h1>
    @if (subtitle()) {
      <p class="page-header__subtitle">{{ subtitle() }}</p>
    }
  </div>
</div>
